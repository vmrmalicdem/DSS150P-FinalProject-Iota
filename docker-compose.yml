services:
  postgres:
    image: postgres:16
    container_name: shortvideo_risk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # pipeline service: placeholder for the app/orchestration image (built from ./Dockerfile).
  # No ingestion/transformation/Airflow behavior is wired in yet - Day 1 scope only.
  pipeline:
    build: .
    container_name: shortvideo_risk_pipeline
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres   # service name inside the Compose network
    volumes:
      - ./:/app

volumes:
  pgdata:
